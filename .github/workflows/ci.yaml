name: CI
on:
  pull_request:
  workflow_call:
jobs:
  Checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # the deploy workflows build with `vercel build`; this catches a broken
      # build on the pull request, under the required "Checks" status
      - name: Build
        run: npm run build
